name: wheels
run-name: Build binary wheels and publish

# Deliberately NOT run on every push. cibuildwheel compiles the extension once
# per interpreter per platform, which is slow and expensive; ordinary CI in
# ci.yml already proves the code builds and passes.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Where to publish the built distributions"
        required: true
        default: none
        type: choice
        options: [none, testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest       # manylinux x86_64
          - os: ubuntu-24.04-arm    # manylinux aarch64, native runner
          - os: macos-13            # Intel
          - os: macos-14            # Apple silicon
          - os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools-scm needs the tags

      # cibuildwheel reads its configuration from [tool.cibuildwheel] in
      # pyproject.toml, including the post-build import check that fails the
      # build if a wheel ships without its extension.
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Verify the sdist rebuilds
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/python -m pip install --upgrade pip
          /tmp/sdist-venv/bin/python -m pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/python -c "import template_python_project as t; assert t.HAS_EXTENSION"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to ${{ github.event_name == 'push' && 'pypi' || inputs.publish_target }}
    needs: [build-wheels, build-sdist]
    # A tag push publishes to PyPI; a manual run publishes only if asked.
    if: github.event_name == 'push' || inputs.publish_target != 'none'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'pypi' || inputs.publish_target }}
    permissions:
      # Trusted Publishing (OIDC): GitHub mints a short-lived token for this
      # workflow, so no PyPI API token is stored as a repository secret at all.
      # Configure the publisher once at https://pypi.org/manage/account/publishing/
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -l dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.publish_target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
