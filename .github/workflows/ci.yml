name: ci
run-name: Lint, type-check and test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop, "dev*"]
  workflow_dispatch:

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  # Lint and type-check once, on one interpreter. These checks are
  # platform-independent, so running them across the whole matrix would only
  # buy duplicate failures.
  static-checks:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from tags, which a shallow
          # clone does not fetch.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # Match type checking to the minimum supported runtime.
          python-version: "3.10"
          cache: pip

      - name: Install project and lint tooling
        run: |
          python -m pip install --upgrade pip   # PEP 735 --group needs pip >= 25.1
          python -m pip install --group lint --group test . -C wheel.cmake=false

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check --diff .

      - name: mypy
        run: mypy src tests

  # The real matrix: build the extension and run the suite everywhere the
  # package claims to work.
  test:
    name: Test ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Speeds up repeat C++ compiles on the Unix runners. Windows uses MSVC,
      # which this action does not cover.
      - name: Set up compiler cache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.python-version }}

      - name: Install with compiled extension
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test . -v

      - name: Confirm the extension actually built
        # Without this, a silent fallback to pure Python would let the suite
        # pass while testing none of the C++.
        run: |
          python -c "import template_python_project as t; print(t.__version__, t.backend_name()); assert t.HAS_EXTENSION, 'extension did not build'"

      - name: Run tests
        run: pytest -v

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  # Editable auto-rebuilds happen after pip's temporary isolated build
  # environment is gone. Keep build requirements in the active environment
  # and verify a native source change triggers a rebuild.
  editable-rebuild:
    name: Editable native rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install editable development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test --group ext
          python -m pip install --no-build-isolation -e . -v

      - name: Confirm initial native build
        run: |
          python -c "import template_python_project as t; print(t.__version__, t.backend_name()); assert t.HAS_EXTENSION, 'extension did not build'"

      - name: Confirm native source change rebuilds
        run: |
          extension_path=$(python -c "import template_python_project._core as c; print(c.__file__)")
          previous_mtime=$(stat -c %Y "${extension_path}")
          sleep 1
          touch src/cpp/template_ext.cpp
          python -c "import template_python_project as t; print(t.__version__, t.backend_name()); assert t.HAS_EXTENSION, 'extension rebuild failed'"
          rebuilt_mtime=$(stat -c %Y "${extension_path}")
          test "${rebuilt_mtime}" -gt "${previous_mtime}"
          pytest -m extension -v

  # The template promises the package works with no compiler. Prove it.
  pure-python:
    name: Pure-Python install (no extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install without building the extension
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test . -C wheel.cmake=false

      - name: Confirm the fallback path is active
        run: |
          python -c "import template_python_project as t; assert not t.HAS_EXTENSION, 'extension unexpectedly present'; print(t.backend_name())"

      - name: Run tests against the fallback
        # Extension-only tests skip; everything else must still pass.
        run: pytest -v

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev -e .

      - name: Run examples 1-3
        run: |
          python examples/01_pure_python_usage.py
          python examples/02_pybind11_extension_usage.py
          python examples/03_accelerated_fallback.py

      - name: Build and run the external C library example
        run: ./examples/04_wire_external_c_library/build_and_run.sh

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group docs . -C wheel.cmake=false

      - name: Build documentation
        # No compiler is used here on purpose: doc/conf.py mocks the compiled
        # module, so the docs must build without one.
        run: sphinx-build -b html doc doc/_build/html -W --keep-going

  build-artifacts:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - name: Verify the sdist rebuilds cleanly
        # An sdist that cannot rebuild is broken for every consumer who does
        # not get a matching wheel.
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/python -m pip install --upgrade pip
          /tmp/sdist-venv/bin/python -m pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/python -c "import template_python_project as t; print(t.__version__, t.backend_name())"

      - name: Verify distinct distribution and import package names
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
        run: |
          derived_dir=$(mktemp -d)
          wheel_dir=$(mktemp -d)
          git archive --format=tar HEAD | tar -xf - -C "${derived_dir}"
          "${derived_dir}/tailor_template_cleanup.sh" --apply --yes \
            --root "${derived_dir}" --project-name demo-dist --package-name demo_pkg
          python -m pip wheel --no-deps --wheel-dir "${wheel_dir}" "${derived_dir}"
          python -m venv /tmp/tailored-venv
          /tmp/tailored-venv/bin/python -m pip install "${wheel_dir}"/*.whl
          /tmp/tailored-venv/bin/python - <<'PY'
          from pathlib import Path

          import demo_pkg

          print(demo_pkg.backend_name())
          assert demo_pkg.HAS_EXTENSION
          assert (Path(demo_pkg.__file__).parent / "_core.pyi").is_file()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
