name: docs
run-name: Build and publish documentation

on:
  push:
    branches: [main, master]
    paths:
      - "doc/**"
      - "src/**"
      - "README.md"
      - "examples/**"
      - ".github/workflows/docs_pages.yml"
  pull_request:
    branches: [main, master, develop, "dev*"]
    paths:
      - "doc/**"
      - "src/**"
      - "README.md"
      - "examples/**"
      - ".github/workflows/docs_pages.yml"
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy to GitHub Pages after building"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        # wheel.cmake=false proves the docs build with no compiler present,
        # which is what doc/conf.py's autodoc_mock_imports exists for.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group docs . -C wheel.cmake=false

      - name: Build documentation
        run: sphinx-build -b html doc doc/_build/html -W --keep-going

      - name: Verify generated site
        run: |
          test -f doc/_build/html/index.html
          grep -qF "template_python_project" doc/_build/html/index.html

      - name: Upload Pages artifact
        # Only the deployable branch needs an artifact; PRs just prove it builds.
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/_build/html

  deploy:
    # Deploys on a default-branch push, or on an explicit manual request.
    if: >-
      (github.event_name == 'push' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_pages)
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
