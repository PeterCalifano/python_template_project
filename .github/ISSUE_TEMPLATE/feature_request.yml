name: Feature request
description: Propose a scoped improvement to the Python template, extension, docs, or automation.
title: "[FEATURE] "
labels:
  - enhancement
assignees:
  - PeterCalifano
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or missing capability
      description: Explain the current limitation and who is affected.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Owning surface
      options:
        - Python API or fallback
        - pybind11 or CMake extension
        - External library wiring
        - Versioning or packaging
        - Documentation or GitHub Pages
        - CI or release workflow
        - Container or dev container
        - Template tailoring
        - Contribution templates
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the intended behavior, APIs, files, or workflow stages.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: List the tests, package checks, docs build, or workflow checks that should prove the change.
      render: text
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note simpler, narrower, or rejected approaches if relevant.
    validations:
      required: false
