name: Feature request
description: Suggest an addition or change to the template
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like the template to do instead.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Packaging / pyproject.toml
        - pybind11 extension or CMake
        - External library wiring
        - Tests
        - Documentation
        - CI/CD
        - Containers / devcontainer
        - Tailoring script
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: |
        This is a template, so additions are carried by every derived project.
      options:
        - label: This belongs in the template itself, not in a project derived from it.
