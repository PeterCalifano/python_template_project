name: Bug report
description: Report a reproducible Python, extension, packaging, documentation, or CI problem.
title: "[BUG] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: State the observed failure and the expected behavior.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Python API or fallback
        - pybind11 or CMake extension
        - External library wiring
        - Versioning or packaging
        - Documentation or GitHub Pages
        - CI or release workflow
        - Container or dev container
        - Template tailoring
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction commands
      description: Paste the exact commands from a clean checkout or clean build directory.
      render: bash
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output excerpt
      description: Include the first real error and the surrounding context.
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and runner
      placeholder: "Ubuntu 24.04, macOS 15, Windows Server 2025, GitHub-hosted runner, ..."
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Python, compiler, and build tools
      placeholder: "Python 3.10, GCC 13.2, CMake 3.28.3, pip 25.1"
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Build configuration
      description: >-
        Include the install command, active backend, CMake options, toolchain file, and whether
        this is the source template or a tailored project.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I verified whether the failure occurs in a clean environment.
          required: true
        - label: I included the installation method and active backend.
          required: true
        - label: I included the relevant workflow run or documentation URL when applicable.
          required: true
