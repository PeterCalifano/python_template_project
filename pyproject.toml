[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "template_python_project"
description = "Reusable Python package template with src layout, tests, docs, and CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Pietro Califano", email = "petercalifano.gs@gmail.com" },
]
dynamic = ["version"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "twine>=5.1",
]
docs = [
    "sphinx>=8.1",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-rtd-theme>=3.0",
]
cuda_related = [
    "pynvml; platform_machine == 'x86_64'",
    "pycuda; platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
addopts = "--cov=template_python_project --cov-report=term-missing --cov-report=xml:coverage.xml --maxfail=10 -rf"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test*.py"]
python_functions = ["test*", "*test"]
console_output_style = "count"
junit_family = "xunit2"
markers = [
    "integration: marks integration tests",
    "gpu: marks tests that require optional GPU dependencies",
    "slow: marks slow-running tests",
    "unit: marks fast offline tests",
]
norecursedirs = [".git", ".venv", "build", "dist", "doc/_build"]
log_cli_level = "INFO"

[tool.coverage.run]
branch = true
source = ["template_python_project"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "coverage_html_report"

[tool.mypy]
files = ["src", "tests"]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true
check_untyped_defs = true
local_partial_types = true
enable_error_code = ["possibly-undefined"]
exclude = [
    "build/.*",
    "dist/.*",
    "doc/_build/.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/template_python_project/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/template_python_project"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/doc",
    "/README.md",
    "/LICENSE",
]
